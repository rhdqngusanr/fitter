<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
:root{
  --color-primary-50:#EEF3F8; --color-primary-100:#D8E4EF; --color-primary-200:#B3C9DE; --color-primary-300:#85A7C7;
  --color-primary-400:#5583AC; --color-primary-500:#2F6390; --color-primary-600:#245176; --color-primary-700:#1C405D; --color-primary-800:#163348;
  --color-secondary-100:#F3E9E2; --color-secondary-300:#D9AE92; --color-secondary-500:#A8623C; --color-secondary-600:#8B4E2D;
  --color-bg:#FFFFFF; --color-bg-subtle:#F5F7F9; --color-bg-sunken:#EDF0F3; --color-surface:#FFFFFF; --color-surface-hover:#F5F7F9;
  --color-text-primary:#171B20; --color-text-secondary:#515A65; --color-text-tertiary:#69737F; --color-text-inverse:#FFFFFF;
  --color-success-bg:#E7F3EC; --color-success:#1F7A4C; --color-warning-bg:#FBF1DC; --color-warning:#9A6B0F;
  --color-danger-bg:#FBEAE7; --color-danger:#B03A2E;
  --color-border:#DFE4E9; --color-border-strong:#C7CED6; --color-border-focus:#2F6390;
  --color-scrim:rgba(14,17,20,.56);
  --radius-sm:4px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px; --radius-full:999px;
  --shadow-1:0 1px 2px rgba(23,27,32,.06), 0 1px 3px rgba(23,27,32,.08);
  --shadow-2:0 2px 6px rgba(23,27,32,.06), 0 6px 16px rgba(23,27,32,.10);
  --shadow-3:0 8px 20px rgba(23,27,32,.10), 0 20px 44px rgba(23,27,32,.14);
  --font-sans:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
body{margin:0;font-family:var(--font-sans);-webkit-font-smoothing:antialiased;background:var(--color-bg-sunken);font-feature-settings:"tnum";}
*{box-sizing:border-box;}
a{color:var(--color-primary-500);text-decoration:none;}
a:hover{color:var(--color-primary-600);text-decoration:underline;}
button,input,select,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--color-border-focus);outline-offset:2px;border-radius:var(--radius-sm);}
</style>
</helmet>

<div style="min-height:100vh;background:var(--color-bg-sunken);padding:24px 0 80px">

  <div style="max-width:1360px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between">
      <div style="display:flex;align-items:baseline;gap:10px">
        <span style="font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--color-text-primary)">A-01 · A-02 관리자</span>
        <span style="font-size:13px;color:var(--color-text-tertiary)">시공자 승인 / 신고 처리 · /admin/pro-approvals · /admin/reports</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <sc-for list="{{ stateTabs }}" as="t" hint-placeholder-count="6">
          <button onClick="{{ t.onClick }}" aria-pressed="{{ t.active }}" style="height:34px;padding:0 14px;border-radius:var(--radius-full);border:1px solid {{ t.border }};background:{{ t.bg }};color:{{ t.fg }};font-size:13px;font-weight:700;cursor:pointer">{{ t.label }}</button>
        </sc-for>
      </div>
    </div>
    <p style="margin:0;font-size:13px;color:var(--color-text-secondary);max-width:960px">{{ stateNote }}</p>
  </div>

  <div style="margin:28px 0 0;padding:0 24px 12px;display:flex;flex-direction:column;gap:10px">
    <span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--color-text-tertiary)">DESKTOP 1440 · 관리자 전용(모바일 미지원)</span>
    <div style="position:relative;width:1440px;background:var(--color-bg);border:1px solid var(--color-border-strong);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-2);display:grid;grid-template-columns:236px minmax(0,1fr)">

      <aside style="background:var(--color-primary-800);padding:22px 16px;display:flex;flex-direction:column;gap:22px;min-height:900px">
        <span style="display:flex;flex-direction:column;gap:2px;padding:0 8px">
          <span style="font-size:18px;font-weight:800;letter-spacing:-.02em;color:#FFFFFF">Fitter</span>
          <span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;color:#85A7C7">ADMIN CONSOLE</span>
        </span>
        <nav aria-label="관리자 메뉴" style="display:flex;flex-direction:column;gap:4px">
          <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="5">
            <button onClick="{{ n.onClick }}" aria-current="{{ n.active }}" style="display:flex;align-items:center;justify-content:space-between;gap:10px;height:42px;padding:0 12px;border:none;border-radius:var(--radius-md);background:{{ n.bg }};color:{{ n.fg }};font-size:15px;font-weight:{{ n.weight }};cursor:pointer;text-align:left">
              <span>{{ n.label }}</span>
              <span style="font-family:var(--font-mono);font-size:12px;color:{{ n.countFg }};background:{{ n.countBg }};padding:2px 7px;border-radius:var(--radius-full)">{{ n.count }}</span>
            </button>
          </sc-for>
        </nav>
        <div style="margin-top:auto;border-top:1px solid #245176;padding-top:14px;display:flex;flex-direction:column;gap:6px">
          <span style="font-size:13px;font-weight:700;color:#FFFFFF">운영자 · 한지훈</span>
          <span style="font-size:12px;color:#85A7C7">admin@fitter.kr</span>
          <span style="font-family:var(--font-mono);font-size:11px;color:#5583AC;margin-top:4px">모든 조치는 감사 로그에 남습니다</span>
        </div>
      </aside>

      <main style="display:flex;flex-direction:column;min-width:0">
        <header style="height:68px;border-bottom:1px solid var(--color-border);padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:20px">
          <div style="display:flex;align-items:baseline;gap:12px">
            <h1 style="margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--color-text-primary)">{{ pageTitle }}</h1>
            <span style="font-family:var(--font-mono);font-size:12px;color:var(--color-text-tertiary)">{{ endpoint }}</span>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <label style="display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--color-border-strong);border-radius:var(--radius-md);background:var(--color-surface);width:280px">
              <span style="font-size:14px;color:var(--color-text-tertiary)">⌕</span>
              <input placeholder="{{ searchPlaceholder }}" style="border:none;outline:none;background:transparent;font-size:14px;width:100%;color:var(--color-text-primary)" />
            </label>
            <button style="height:38px;padding:0 14px;border:1px solid var(--color-border-strong);border-radius:var(--radius-md);background:var(--color-surface);color:var(--color-text-primary);font-size:14px;font-weight:700;cursor:pointer" style-hover="background:var(--color-surface-hover)">CSV 내보내기</button>
          </div>
        </header>

        <div style="padding:20px 28px;border-bottom:1px solid var(--color-border);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap">
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
              <button onClick="{{ f.onClick }}" aria-pressed="{{ f.active }}" style="height:36px;padding:0 14px;border-radius:var(--radius-full);border:1px solid {{ f.border }};background:{{ f.bg }};color:{{ f.fg }};font-size:14px;font-weight:600;cursor:pointer">{{ f.label }}</button>
            </sc-for>
          </div>
          <div style="display:flex;gap:20px">
            <sc-for list="{{ kpis }}" as="k" hint-placeholder-count="3">
              <span style="display:flex;flex-direction:column;gap:2px;align-items:flex-end">
                <strong style="font-size:19px;font-weight:800;color:{{ k.fg }}">{{ k.v }}</strong>
                <span style="font-size:12px;color:var(--color-text-tertiary)">{{ k.k }}</span>
              </span>
            </sc-for>
          </div>
        </div>

        {{ bulkBar }}

        <div style="padding:0 0 28px;min-height:660px">
          {{ table }}
        </div>
      </main>

      {{ drawer }}
      {{ toast }}
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1520},&quot;initialView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;approvals&quot;,&quot;detail&quot;,&quot;approved&quot;,&quot;emptyQueue&quot;,&quot;reports&quot;,&quot;reportDetail&quot;],&quot;default&quot;:&quot;approvals&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { view: "approvals", filter: "대기 중", selected: [], openRow: null };

  pros() {
    return [
      { id: "PRO-2481", name: "김도배", trade: "도배", region: "성북·강북·노원", years: 11, biz: "412-31-90287",
        bizName: "성북도배", submitted: "7월 25일 09:12", docs: ["사업자등록증.pdf", "도배기능사.jpg"], portfolios: 12,
        flags: [], risk: "low" },
      { id: "PRO-2480", name: "이바닥", trade: "바닥·장판", region: "노원·도봉", years: 6, biz: "220-19-44710",
        bizName: "이바닥마루", submitted: "7월 25일 08:40", docs: ["사업자등록증.pdf"], portfolios: 5,
        flags: ["자격증 미제출"], risk: "mid" },
      { id: "PRO-2478", name: "빠른시공", trade: "타일", region: "전국", years: 1, biz: "미제출",
        bizName: "-", submitted: "7월 24일 22:05", docs: [], portfolios: 0,
        flags: ["사업자 미제출", "활동 지역 전국", "포트폴리오 0건"], risk: "high" },
      { id: "PRO-2477", name: "최목공", trade: "목공", region: "성동·광진", years: 9, biz: "108-82-31905",
        bizName: "최목공방", submitted: "7월 24일 17:31", docs: ["사업자등록증.pdf", "건축목공기능사.pdf"], portfolios: 21,
        flags: [], risk: "low" }
    ];
  }

  reports() {
    return [
      { id: "RP-0342", type: "허위 포트폴리오", target: "빠른시공 (PRO-2478)", targetKind: "시공자",
        by: "윤지수 (고객)", when: "7월 25일 11:02", severity: "high",
        body: "포트폴리오 사진 4장이 해외 인테리어 블로그 사진과 동일합니다. 링크 첨부합니다.", evidence: 3, status: "미처리" },
      { id: "RP-0341", type: "연락처 외부 유도", target: "이도배 (PRO-2455)", targetKind: "시공자",
        by: "박서준 (고객)", when: "7월 25일 09:47", severity: "mid",
        body: "컨택 수락 전에 의뢰 메모에 개인 번호를 적어 직접 연락을 요구했습니다.", evidence: 1, status: "미처리" },
      { id: "RP-0339", type: "부적절한 사진", target: "RQ-2026-0692 (의뢰)", targetKind: "의뢰",
        by: "자동 필터", when: "7월 24일 20:15", severity: "low",
        body: "업로드 사진 1장이 자동 검열에 걸렸습니다. 사람 얼굴이 포함된 것으로 보입니다.", evidence: 1, status: "처리 중" },
      { id: "RP-0335", type: "노쇼", target: "성북벽지 (PRO-2401)", targetKind: "시공자",
        by: "김민아 (고객)", when: "7월 23일 14:20", severity: "mid",
        body: "약속한 시공일에 나타나지 않았고 이후 연락이 되지 않습니다.", evidence: 2, status: "처리 완료" }
    ];
  }

  renderVals() {
    const R = React.createElement;
    const view = this.state.view;
    const isApprovals = view === "approvals" || view === "detail" || view === "approved" || view === "emptyQueue";
    const empty = view === "emptyQueue";
    const detail = view === "detail";
    const approved = view === "approved";

    const tabs = [
      ["approvals", "A-01 승인 큐"], ["detail", "A-01 심사 상세"], ["approved", "승인 처리 완료"],
      ["emptyQueue", "A-01 빈 큐"], ["reports", "A-02 신고 큐"], ["reportDetail", "A-02 신고 상세"]
    ];
    const notes = {
      approvals: "지금 수동 DB 작업으로 하고 있는 승인을 화면으로 옮긴 것. 한 줄에 판단 근거(서류·포트폴리오 수·위험 신호)를 모두 넣어 대부분 목록에서 바로 처리하고, 애매한 건만 상세를 연다. 체크박스 다중 선택 → 일괄 승인 지원.",
      detail: "우측 드로어로 상세를 연다. 목록 맥락을 잃지 않고 서류 원본·포트폴리오·위험 신호를 확인한 뒤 승인 또는 반려(사유 필수)한다. POST /admin/pro-approvals.",
      approved: "처리 직후. 행이 목록에서 빠지고 되돌리기 가능한 토스트가 뜬다. 승인되면 시공자에게 알림이 가고 P-01의 인증 배지가 즉시 붙는다.",
      emptyQueue: "대기 0건. 운영자가 “다 봤다”를 확신할 수 있게 마지막 처리 시각과 오늘 처리량을 남긴다.",
      reports: "A-02 신고 처리. 심각도·유형·대상으로 정렬하고, 같은 대상에 신고가 누적되면 행에 누적 배지를 붙인다. GET /admin/reports.",
      reportDetail: "신고 상세 드로어. 증거 사진과 신고 내용을 보고 조치(경고·노출 중단·계정 정지·기각)를 고른다. 조치는 대상에게 통보되고 감사 로그에 남는다."
    };
    const stateTabs = tabs.map(([k, label]) => ({
      label, active: view === k,
      bg: view === k ? "var(--color-primary-500)" : "var(--color-surface)",
      fg: view === k ? "#FFFFFF" : "var(--color-text-secondary)",
      border: view === k ? "var(--color-primary-500)" : "var(--color-border-strong)",
      onClick: () => this.setState({ view: k, selected: [] })
    }));

    const navDef = [
      ["approvals", "시공자 승인", empty ? "0" : "12"],
      ["reports", "신고 처리", "4"],
      ["users", "회원", "1.2k"],
      ["requests", "의뢰", "318"],
      ["audit", "감사 로그", ""]
    ];
    const navItems = navDef.map(([k, label, count]) => {
      const active = k === "reports" ? !isApprovals : (k === "approvals" ? isApprovals : false);
      return {
        label, count: count || "—", active,
        bg: active ? "#245176" : "transparent",
        fg: active ? "#FFFFFF" : "#B3C9DE",
        weight: active ? 700 : 600,
        countBg: active ? "#2F6390" : "rgba(255,255,255,.06)",
        countFg: active ? "#FFFFFF" : "#85A7C7",
        onClick: () => this.setState({ view: k === "approvals" ? "approvals" : (k === "reports" ? "reports" : view), selected: [] })
      };
    });

    const filterDefs = isApprovals
      ? ["대기 중", "서류 미비", "재제출", "전체"]
      : ["미처리", "처리 중", "심각도 높음", "전체"];
    const filters = filterDefs.map(label => {
      const active = this.state.filter === label || (filterDefs.indexOf(this.state.filter) < 0 && label === filterDefs[0]);
      return {
        label, active,
        bg: active ? "var(--color-primary-500)" : "var(--color-surface)",
        fg: active ? "#FFFFFF" : "var(--color-text-secondary)",
        border: active ? "var(--color-primary-500)" : "var(--color-border-strong)",
        onClick: () => this.setState({ filter: label })
      };
    });

    const kpis = isApprovals
      ? [{ k: "대기", v: empty ? "0" : "12", fg: empty ? "var(--color-success)" : "var(--color-warning)" },
         { k: "오늘 승인", v: "9", fg: "var(--color-text-primary)" },
         { k: "평균 처리", v: "6시간", fg: "var(--color-text-primary)" }]
      : [{ k: "미처리", v: "2", fg: "var(--color-danger)" },
         { k: "이번 주 신고", v: "11", fg: "var(--color-text-primary)" },
         { k: "정지 계정", v: "3", fg: "var(--color-text-primary)" }];

    const badge = (text, tone) => {
      const tones = {
        low: ["var(--color-success-bg)", "var(--color-success)"],
        mid: ["var(--color-warning-bg)", "var(--color-warning)"],
        high: ["var(--color-danger-bg)", "var(--color-danger)"],
        neutral: ["var(--color-bg-sunken)", "var(--color-text-tertiary)"],
        info: ["var(--color-primary-50)", "var(--color-primary-600)"],
        cert: ["var(--color-secondary-100)", "var(--color-secondary-600)"]
      }[tone] || ["var(--color-bg-sunken)", "var(--color-text-tertiary)"];
      return R("span", { style: { display: "inline-flex", alignItems: "center", height: "24px", padding: "0 9px", borderRadius: "var(--radius-sm)", background: tones[0], color: tones[1], fontSize: "12px", fontWeight: 700, whiteSpace: "nowrap" } }, text);
    };

    const btn = (label, kind, onClick) => {
      const kinds = {
        primary: { border: "none", background: "var(--color-primary-500)", color: "#FFFFFF" },
        approve: { border: "none", background: "var(--color-success)", color: "#FFFFFF" },
        ghost: { border: "1px solid var(--color-border-strong)", background: "var(--color-surface)", color: "var(--color-text-primary)" },
        danger: { border: "1px solid #EFC4BC", background: "var(--color-danger-bg)", color: "var(--color-danger)" },
        quiet: { border: "none", background: "transparent", color: "var(--color-text-tertiary)" }
      };
      return R("button", { onClick, style: { height: "38px", padding: "0 14px", borderRadius: "var(--radius-md)", fontSize: "14px", fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap", ...kinds[kind] } }, label);
    };

    const th = (label, w) => R("th", { style: { textAlign: "left", padding: "10px 16px", fontSize: "12px", fontWeight: 700, letterSpacing: ".04em", color: "var(--color-text-tertiary)", background: "var(--color-bg-subtle)", borderBottom: "1px solid var(--color-border)", width: w, whiteSpace: "nowrap" } }, label);
    const td = (children, style) => R("td", { style: { padding: "14px 16px", borderBottom: "1px solid var(--color-border)", verticalAlign: "middle", ...(style || {}) } }, children);

    const toggleSel = id => this.setState(s => ({ selected: s.selected.indexOf(id) >= 0 ? s.selected.filter(x => x !== id) : s.selected.concat(id) }));
    const checkbox = (on, onClick) => R("button", {
      onClick, "aria-pressed": on,
      style: { width: "20px", height: "20px", borderRadius: "var(--radius-sm)", border: "1px solid " + (on ? "var(--color-primary-500)" : "var(--color-border-strong)"), background: on ? "var(--color-primary-500)" : "var(--color-surface)", color: "#FFFFFF", fontSize: "12px", fontWeight: 800, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", padding: 0 }
    }, on ? "✓" : "");

    const emptyState = R("div", {
      style: { margin: "28px", border: "1px dashed var(--color-border-strong)", borderRadius: "var(--radius-lg)", background: "var(--color-bg-subtle)", padding: "72px 32px", display: "flex", flexDirection: "column", alignItems: "center", gap: "10px", textAlign: "center" }
    },
      R("strong", { style: { fontSize: "22px", fontWeight: 800, letterSpacing: "-.02em", color: "var(--color-text-primary)" } }, "대기 중인 승인 요청이 없습니다"),
      R("span", { style: { fontSize: "15px", lineHeight: 1.6, color: "var(--color-text-secondary)", maxWidth: "460px" } },
        "마지막 처리는 오늘 14:32. 오늘 승인 9건, 반려 1건. 새 신청이 들어오면 이 화면과 운영 슬랙으로 동시에 알림이 갑니다."),
      R("div", { style: { display: "flex", gap: "8px", marginTop: "8px" } }, btn("감사 로그 보기", "ghost"), btn("신고 큐로 이동", "primary", () => this.setState({ view: "reports" }))));
