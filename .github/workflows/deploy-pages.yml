name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 하나의 배포만 진행 (진행 중 배포는 취소하지 않음)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      # Pages가 꺼져 있어도 워크플로가 자동으로 활성화(enablement)
      - name: Pages 설정
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # docs 폴더를 사이트 산출물로 업로드
      - name: docs 폴더 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
