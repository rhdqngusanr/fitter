# 로컬 개발 환경.
#
# 운영에서는 관리형 서비스를 쓴다(Postgres는 Neon, Redis는 Upstash 등).
# 이 파일의 목적은 "내 PC에서 한 줄로 같은 환경이 뜬다"이지 운영 재현이 아니다.
#
#   docker compose up -d      띄우기
#   docker compose down       내리기 (데이터는 볼륨에 남는다)
#   docker compose down -v    데이터까지 지우기
#
# 근거: brain/50-결정/ADR-001 - 기술 스택 선정.md

services:
  postgres:
    image: postgres:16-alpine
    container_name: fitter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitter
      POSTGRES_PASSWORD: fitter_dev_only
      POSTGRES_DB: fitter
      # 한국어 정렬과 대소문자 처리를 운영과 맞춘다
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # 마이그레이션이 DB보다 먼저 뜨면 실패한다. 준비될 때까지 기다리게 한다.
      test: ['CMD-SHELL', 'pg_isready -U fitter -d fitter']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fitter-redis
    restart: unless-stopped
    # BullMQ는 작업 유실을 막기 위해 AOF를 켠 상태를 권장한다. P4-2에서 쓴다.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 호환 로컬 스토리지.
  # 운영은 Cloudflare R2를 쓴다(egress 무료). API가 같아서 어댑터는 그대로이고
  # 바뀌는 건 .env 의 엔드포인트와 자격증명뿐이다.
  minio:
    image: minio/minio:latest
    container_name: fitter-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: fitter
      MINIO_ROOT_PASSWORD: fitter_dev_only
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # 웹 콘솔
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # 버킷을 만들고 끝나는 일회성 컨테이너.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 fitter fitter_dev_only &&
      mc mb --ignore-existing local/fitter-images &&
      mc anonymous set download local/fitter-images &&
      echo '버킷 준비 완료 (읽기 공개)'
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
